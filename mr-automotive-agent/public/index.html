<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M.R. Automotive — Sarah (AI Receptionist)</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3348;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --sarah-bubble: #1e2235;
      --sarah-border: #2d3352;
      --user-bubble: #1d4ed8;
      --text: #e8eaf0;
      --text-muted: #8b90a8;
      --green: #22c55e;
      --red: #ef4444;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      min-height: 100vh;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 680px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 32px);
      min-height: 500px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      position: relative;
    }

    .status-dot {
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--green);
      border: 2px solid var(--surface2);
    }

    .header-info h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    .header-info p {
      font-size: 12px;
      color: var(--green);
      font-weight: 500;
    }

    .reset-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: var(--font);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .reset-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(59, 130, 246, 0.08);
    }

    .reset-btn:active {
      transform: scale(0.97);
    }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 5px;
    }
    .messages::-webkit-scrollbar-track {
      background: transparent;
    }
    .messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 10px;
    }

    /* ── Message row ── */
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-row.sarah {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14.5px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .msg-row.user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-row.sarah .bubble {
      background: var(--sarah-bubble);
      color: var(--text);
      border: 1px solid var(--sarah-border);
      border-bottom-left-radius: 4px;
    }

    .msg-time {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ── Typing indicator ── */
    .typing-row {
      display: flex;
      align-self: flex-start;
      align-items: flex-start;
      flex-direction: column;
      max-width: 82%;
      animation: fadeUp 0.2s ease;
    }

    .typing-bubble {
      background: var(--sarah-bubble);
      border: 1px solid var(--sarah-border);
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      padding: 13px 18px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%            { transform: translateY(-6px); opacity: 1; }
    }

    /* ── Empty state ── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      gap: 10px;
      text-align: center;
      padding: 40px 20px;
    }

    .empty-icon {
      font-size: 36px;
      margin-bottom: 4px;
    }

    .empty-state h2 {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .empty-state p {
      font-size: 13px;
      max-width: 260px;
    }

    /* ── Input bar ── */
    .input-bar {
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--surface2);
      flex-shrink: 0;
    }

    .input-wrap {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: flex-end;
      padding: 10px 14px;
      transition: border-color 0.15s ease;
    }

    .input-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }

    #user-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 14.5px;
      line-height: 1.5;
      resize: none;
      max-height: 120px;
      min-height: 22px;
      overflow-y: auto;
    }

    #user-input::placeholder {
      color: var(--text-muted);
    }

    #user-input::-webkit-scrollbar { width: 0; }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .send-btn:hover {
      background: var(--accent-hover);
    }

    .send-btn:active {
      transform: scale(0.93);
    }

    .send-btn:disabled {
      background: var(--border);
      cursor: not-allowed;
      opacity: 0.6;
    }

    .send-btn svg {
      fill: white;
      width: 18px;
      height: 18px;
    }

    /* ── Error toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #2d1c1c;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      transition: transform 0.3s ease;
      z-index: 100;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      body { padding: 0; }
      .card {
        border-radius: 0;
        height: 100vh;
        height: 100dvh;
        border: none;
      }
      .msg-row { max-width: 92%; }
    }
  </style>
</head>
<body>

<div class="card">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="avatar">
        S
        <span class="status-dot"></span>
      </div>
      <div class="header-info">
        <h1>M.R. Automotive — Sarah</h1>
        <p>● AI Receptionist · Online</p>
      </div>
    </div>
    <button class="reset-btn" id="reset-btn" title="Start a new conversation">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"></polyline>
        <path d="M3.51 15a9 9 0 1 0 .49-4.5"></path>
      </svg>
      Reset
    </button>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">🚗</div>
      <h2>Connecting to Sarah…</h2>
      <p>The AI receptionist is warming up.</p>
    </div>
  </div>

  <!-- Input bar -->
  <div class="input-bar">
    <div class="input-wrap">
      <textarea
        id="user-input"
        rows="1"
        placeholder="Type a message…"
        aria-label="Message"
        disabled
      ></textarea>
    </div>
    <button class="send-btn" id="send-btn" disabled aria-label="Send">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<!-- Error toast -->
<div class="toast" id="toast"></div>

<script>
  const messagesEl   = document.getElementById('messages');
  const inputEl      = document.getElementById('user-input');
  const sendBtn      = document.getElementById('send-btn');
  const resetBtn     = document.getElementById('reset-btn');
  const emptyStateEl = document.getElementById('empty-state');
  const toastEl      = document.getElementById('toast');

  let busy = false;

  // ── Helpers ──────────────────────────────────────────────────────────────

  function now() {
    return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
  }

  function hideEmpty() {
    if (emptyStateEl) emptyStateEl.remove();
  }

  function appendMessage(role, text) {
    hideEmpty();
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'You' : 'Sarah';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = now();

    row.appendChild(label);
    row.appendChild(bubble);
    row.appendChild(time);
    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  function showTyping() {
    hideEmpty();
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.id = 'typing-indicator';

    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = 'Sarah';

    const bubble = document.createElement('div');
    bubble.className = 'typing-bubble';
    bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

    row.appendChild(label);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setEnabled(val) {
    inputEl.disabled = !val;
    sendBtn.disabled = !val;
  }

  let toastTimer;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 4000);
  }

  // ── API calls ─────────────────────────────────────────────────────────────

  async function apiChat(payload) {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${res.status}`);
    }
    return res.json();
  }

  async function loadGreeting() {
    setEnabled(false);
    showTyping();
    try {
      const data = await apiChat({ reset: true });
      hideTyping();
      appendMessage('sarah', data.reply);
      setEnabled(true);
      inputEl.focus();
    } catch (e) {
      hideTyping();
      showToast('Could not reach Sarah — is the server running?');
      console.error(e);
    }
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || busy) return;

    busy = true;
    setEnabled(false);
    inputEl.value = '';
    autoResize();

    appendMessage('user', text);
    showTyping();

    try {
      const data = await apiChat({ message: text });
      hideTyping();
      appendMessage('sarah', data.reply);
    } catch (e) {
      hideTyping();
      showToast('Sarah didn\'t respond — check the server logs.');
      console.error(e);
    } finally {
      busy = false;
      setEnabled(true);
      inputEl.focus();
    }
  }

  async function resetConversation() {
    if (busy) return;

    // Clear chat
    messagesEl.innerHTML = '';
    inputEl.value = '';
    autoResize();

    await loadGreeting();
  }

  // ── Auto-resize textarea ──────────────────────────────────────────────────

  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  }

  inputEl.addEventListener('input', autoResize);

  // ── Event listeners ───────────────────────────────────────────────────────

  sendBtn.addEventListener('click', sendMessage);

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  resetBtn.addEventListener('click', resetConversation);

  // ── Init ──────────────────────────────────────────────────────────────────

  loadGreeting();
</script>
</body>
</html>
